# /etc/nginx/sites-available/alert.b6-team.site.conf
# Kích hoạt:
#   sudo ln -sf /etc/nginx/sites-available/alert.b6-team.site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Cấp chứng chỉ SSL HTTPS:
#   sudo certbot --nginx -d alert.b6-team.site

server {
    server_name alert.b6-team.site;

    # FastAPI middleware giới hạn request tối đa 16KB
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alert.b6-team.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alert.b6-team.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = alert.b6-team.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name alert.b6-team.site;
    return 404; # managed by Certbot
}
