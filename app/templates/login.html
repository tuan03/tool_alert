<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · BKTeam Alerts</title><link rel="stylesheet" href="/static/app.css">  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
</head>
<body class="login-page"><main class="login-card"><div class="brand-mark">B</div><p class="eyebrow">BKTEAM / ORDER MONITOR</p>
<h1>Trạm theo dõi<br>đơn hàng.</h1><p class="muted">Nhập token truy cập trong file .env của server để tiếp tục.</p>
<form id="login-form"><label for="access-token">Token truy cập</label><input id="access-token" type="password" required autocomplete="current-password" placeholder="ADMIN_ACCESS_TOKEN">
<button class="primary full" type="submit">Vào bảng điều khiển <span>→</span></button></form>
<p id="message" class="message" role="status"></p><p class="footnote">Token truy cập riêng biệt với token bot Telegram.</p></main>
<script src="/static/login.js" defer></script></body></html>
